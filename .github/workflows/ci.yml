name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bitsolve_test
          POSTGRES_USER: bitsolve
          POSTGRES_PASSWORD: bitsolve-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bitsolve" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: bits-itsm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bits-itsm/frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Frontend tests and build
        working-directory: bits-itsm/frontend
        run: |
          set -o pipefail
          (npm ci && npm test && npm run build) 2>&1 | tee "$RUNNER_TEMP/frontend.log"
      - name: Backend tests (unit, MockMvc, PostgreSQL) with coverage
        working-directory: bits-itsm/backend
        env:
          BITSOLVE_DB_TESTS: "true"
          BITSOLVE_TEST_DB_URL: jdbc:postgresql://localhost:5432/bitsolve_test
          DB_USER: bitsolve
          DB_PASSWORD: bitsolve-ci
          DEMO_USER_PASSWORD: ci-only-password-123
        run: |
          set -o pipefail
          chmod +x mvnw
          ./mvnw -B -ntp -Pcoverage verify 2>&1 | tee "$RUNNER_TEMP/backend.log"
      # Makes the cause of a failure readable without opening the full log (one annotation per log).
      - name: Summarise failure
        if: failure()
        working-directory: bits-itsm
        run: |
          for f in "$RUNNER_TEMP"/frontend.log "$RUNNER_TEMP"/backend.log; do
            [ -f "$f" ] || continue
            body=$( (grep -E "ERROR|FAIL|Tests run:.*Fail|error:|Caused by|expected|BUILD" "$f" | grep -v "Tests run: [0-9]*, Failures: 0, Errors: 0" | head -60; echo "----- last lines -----"; tail -40 "$f") | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\r//g;s/\n/%0A/g' | cut -c1-60000)
            echo "::error title=$(basename "$f")::$body"
          done
          for r in backend/target/surefire-reports/*.txt; do
            [ -f "$r" ] || continue
            if grep -qE "FAILURE|ERROR" "$r"; then
              body=$(head -60 "$r" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\r//g;s/\n/%0A/g' | cut -c1-20000)
              echo "::error title=$(basename "$r")::$body"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            bits-itsm/backend/target/surefire-reports
            bits-itsm/backend/target/site/jacoco

  # Proves the one-command local run (docker compose up --build) works end to end.
  docker-compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        working-directory: bits-itsm
        run: docker compose up --build -d
      - name: Wait for the app, then log in as a demo student
        run: |
          set -u
          ok=""; for i in $(seq 1 60); do if curl -fs http://localhost:8080/api/health; then ok=1; break; fi; sleep 5; done
          [ -n "$ok" ] || { echo "::error title=smoke::app never became healthy"; exit 1; }
          echo
          code=$(curl -s -o page.html -w '%{http_code}' http://localhost:8080/)
          echo "GET / -> $code"; grep -qi 'id="root"' page.html || { echo "::error title=smoke::UI not served (HTTP $code)"; head -c 400 page.html; exit 1; }
          jar=$(mktemp)
          curl -s -c "$jar" -b "$jar" http://localhost:8080/api/auth/csrf -o csrf.json -w 'GET csrf -> %{http_code}\n'
          header=$(python3 -c 'import json; d=json.load(open("csrf.json")); print(d["headerName"] + ": " + d["token"])')
          code=$(curl -s -o login.json -w '%{http_code}' -c "$jar" -b "$jar" -H "$header" -H 'Content-Type: application/json' \
            -d '{"email":"student01@hyderabad.bits-pilani.ac.in","password":"BitsolveDemo2026"}' http://localhost:8080/api/auth/login)
          echo "POST login -> $code"; cat login.json; echo
          [ "$code" = 200 ] || { echo "::error title=smoke::demo login failed (HTTP $code): $(head -c 300 login.json)"; exit 1; }
          code=$(curl -s -o incidents.json -w '%{http_code}' -b "$jar" http://localhost:8080/api/incidents)
          echo "GET incidents -> $code"
          [ "$code" = 200 ] || { echo "::error title=smoke::incident list failed (HTTP $code): $(head -c 300 incidents.json)"; exit 1; }
          python3 -c 'import json; print("incidents visible to student01:", len(json.load(open("incidents.json"))))'
      - name: App logs on failure
        if: failure()
        working-directory: bits-itsm
        run: |
          body=$(docker compose logs --no-color app 2>&1 | grep -E "ERROR|Exception|Caused by|Started|WARN" | grep -v "already exists, skipping" | tail -25 | cut -c1-240 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\r//g;s/\n/%0A/g')
          echo "::error title=docker-compose app log::$body"
